project:
  type: website
  # Übungsblätter nur als PDF (separater CI-/Lokal-Schritt) — nicht Teil der Website-Render-Pipeline
  render:
    - "*.qmd"
    - "vorlesungen/"
    - "!labs/"

# WaveDrom + PlantUML (Kroki) via quarto-livefigures; Mermaid bleibt Quarto-nativ.
# Syntax: ```{.wavedrom} / ```{.plantuml} — Klassenform mit Punkt (siehe .cursor/rules/dhbw-diagramme.mdc).
filters:
  - at: pre-ast
    path: livefigures

livefigures:
  kroki-url: https://kroki.io

website:
  title: "Echtzeitsysteme"
  description: "Vorlesung Echtzeitsysteme (EZS) an der DHBW Stuttgart"
  site-url: https://dantschi.github.io/echtzeitsysteme/
  favicon: assets/dhbw_logo.svg
  # Keine Sidebar: Startseite = README-ähnlich, Folien direkt verlinkt
  navbar:
    background: light
    title: "EZS"
    left:
      - text: "Startseite"
        href: index.qmd
      - text: "Repository"
        href: https://github.com/dantschi/echtzeitsysteme
  page-navigation: false
  page-footer:
    left: "EZS · DHBW Stuttgart"
    right: "CC BY 4.0"

format:
  # ---------------------------------------------------------------------------
  # Website (HTML) — lean, README-ähnlich (wie MCT1)
  # Pfade relativ (ohne führendes /), sonst bricht CSS auf GitHub Pages.
  # ---------------------------------------------------------------------------
  html:
    theme:
      - cosmo
      - assets/styles/custom.scss
    toc: false
    mainfont: Inter
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  # ---------------------------------------------------------------------------
  # Reveal.js — Vorlesungsfolien (Vortrag)
  # Speaker Notes nur in der Speaker View (Taste S) — nicht auf der Leinwand.
  # ---------------------------------------------------------------------------
  revealjs:
    theme:
      - simple
      - assets/styles/slides.scss
    logo: assets/dhbw_logo.svg
    slide-number: true
    chalkboard: false
    preview-links: auto
    center: false
    # r-stretch kollidiert mit SVG-Schaltungen (Höhe oft 0 → unsichtbar)
    auto-stretch: false
    width: 1280
    height: 720
    margin: 0.08
    show-notes: false
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    include-after-body:
      - assets/scripts/mermaid-fit.html

  # ---------------------------------------------------------------------------
  # PDF-Artikel (optional, für reine Textskripte — nicht Folien-Handout)
  # Folien-Handout: siehe Profil / Format handout (Druckansicht E bzw. --profile handout)
  # ---------------------------------------------------------------------------
  pdf:
    documentclass: article
    papersize: a4
    geometry:
      - margin=3cm
    # TeX Gyre — portabel mit TinyTeX (CI/Linux); Arial/Consolas sind dort oft nicht installiert
    mainfont: TeX Gyre Heros
    sansfont: TeX Gyre Heros
    monofont: TeX Gyre Cursor
    fontsize: 11pt
    linestretch: 1.25
    colorlinks: true
    linkcolor: dhbwred
    urlcolor: dhbwred
    citecolor: dhbwred
    toc: true
    numbersections: true
    keep-tex: false
    include-in-header:
      - text: |
          \usepackage{xcolor}
          \definecolor{dhbwred}{HTML}{E2001A}
