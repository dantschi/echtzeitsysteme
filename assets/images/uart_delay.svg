<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="250" font-family="Inter, sans-serif">
  <style>
    .bg { fill: #F5F5F7; }
    .box-main { fill: #FFFFFF; stroke: #1D1D1F; stroke-width: 2; }
    .box-exec { fill: rgba(226, 0, 26, 0.1); stroke: #E2001A; stroke-width: 2; }
    .box-uart { fill: #E5E5EA; stroke: #86868B; stroke-width: 2; }
    .text-dark { fill: #1D1D1F; font-size: 14px; font-weight: 500; text-anchor: middle; }
    .text-small { fill: #86868B; font-size: 12px; text-anchor: middle; }
    .text-red { fill: #E2001A; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .line-axis { stroke: #1D1D1F; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .line-dash { stroke: #E2001A; stroke-width: 2; stroke-dasharray: 4,4; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D1D1F" />
    </marker>
  </defs>

  <!-- Title -→
  <text x="450" y="25" class="text-dark" font-size="16px" font-weight="bold">Der Beobachter-Effekt durch printf()</text>

  <!-- Axis -→
  <line x1="50" y1="200" x2="850" y2="200" class="line-axis" />
  <text x="850" y="220" class="text-small">Zeit t</text>
  
  <line x1="600" y1="50" x2="600" y2="200" class="line-dash" />
  <text x="600" y="40" class="text-red">Deadline</text>

  <!-- Scenario 1: Without printf -→
  <text x="100" y="85" class="text-small" text-anchor="start">Ideal (Ohne printf):</text>
  <rect x="150" y="100" width="80" height="30" class="box-main" />
  <text x="190" y="120" class="text-dark">Berechnung</text>
  
  <text x="270" y="120" class="text-small" text-anchor="start">Fertig in 10 µs → Deadline sicher erreicht!</text>

  <!-- Scenario 2: With printf -→
  <text x="100" y="145" class="text-small" text-anchor="start">Beobachtet (Mit printf):</text>
  <rect x="150" y="160" width="80" height="30" class="box-main" />
  <text x="190" y="180" class="text-dark">Berechnung</text>

  <rect x="230" y="160" width="450" height="30" class="box-uart" />
  <text x="455" y="180" class="text-dark">printf("Hallo Welt"); über UART (115200 Baud)</text>
  
  <text x="730" y="180" class="text-red" text-anchor="start">DEADLINE MISS!</text>

</svg>