<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="250" font-family="Inter, sans-serif">
  <style>
    .box-main { fill: #FFFFFF; stroke: #1D1D1F; stroke-width: 2; }
    .box-isr { fill: #FFFFFF; stroke: #E2001A; stroke-width: 2; }
    .box-overhead { fill: #F5F5F7; stroke: #86868B; stroke-width: 2; stroke-dasharray: 2,2; }
    .text-dark { fill: #1D1D1F; font-size: 14px; font-weight: 500; text-anchor: middle; }
    .text-small { fill: #86868B; font-size: 12px; text-anchor: start; }
    .text-red { fill: #E2001A; font-size: 12px; font-weight: bold; text-anchor: middle; }
    .line-arrow { stroke: #1D1D1F; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .red-arrow { stroke: #E2001A; stroke-width: 2; fill: none; marker-end: url(#arrow-red); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D1D1F" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E2001A" />
    </marker>
  </defs>
  <text x="450" y="25" class="text-dark" font-size="16px" font-weight="bold" text-anchor="middle">ARM Cortex-M Tail-Chaining</text>
  <line x1="50" y1="210" x2="850" y2="210" class="line-arrow" />
  <text x="820" y="230" class="text-small" text-anchor="middle">Zeit</text>

  <text x="100" y="58" class="text-small">Klassisch (ohne Tail-Chaining):</text>
  <rect x="100" y="70" width="70" height="32" class="box-main" rx="3" />
  <text x="135" y="91" class="text-dark">Main</text>
  <rect x="175" y="70" width="55" height="32" class="box-overhead" rx="3" />
  <text x="202" y="91" class="text-dark">Push</text>
  <rect x="235" y="70" width="90" height="32" class="box-isr" rx="3" />
  <text x="280" y="91" class="text-dark">ISR 1</text>
  <rect x="330" y="70" width="55" height="32" class="box-overhead" rx="3" />
  <text x="357" y="91" class="text-dark">Pop</text>
  <rect x="390" y="70" width="55" height="32" class="box-overhead" rx="3" />
  <text x="417" y="91" class="text-dark">Push</text>
  <rect x="450" y="70" width="90" height="32" class="box-isr" rx="3" />
  <text x="495" y="91" class="text-dark">ISR 2</text>
  <rect x="545" y="70" width="55" height="32" class="box-overhead" rx="3" />
  <text x="572" y="91" class="text-dark">Pop</text>
  <rect x="605" y="70" width="70" height="32" class="box-main" rx="3" />
  <text x="640" y="91" class="text-dark">Main</text>

  <text x="100" y="138" class="text-small">Mit Tail-Chaining (Cortex-M):</text>
  <rect x="100" y="150" width="70" height="32" class="box-main" rx="3" />
  <text x="135" y="171" class="text-dark">Main</text>
  <rect x="175" y="150" width="55" height="32" class="box-overhead" rx="3" />
  <text x="202" y="171" class="text-dark">Push</text>
  <rect x="235" y="150" width="90" height="32" class="box-isr" rx="3" />
  <text x="280" y="171" class="text-dark">ISR 1</text>
  <rect x="330" y="150" width="48" height="32" class="box-overhead" rx="3" stroke="#E2001A" />
  <text x="354" y="171" class="text-red">6 Zyk.</text>
  <rect x="383" y="150" width="90" height="32" class="box-isr" rx="3" />
  <text x="428" y="171" class="text-dark">ISR 2</text>
  <rect x="478" y="150" width="55" height="32" class="box-overhead" rx="3" />
  <text x="505" y="171" class="text-dark">Pop</text>
  <rect x="538" y="150" width="70" height="32" class="box-main" rx="3" />
  <text x="573" y="171" class="text-dark">Main</text>

  <path d="M 354 145 C 380 118, 400 118, 420 145" class="red-arrow" />
  <text x="390" y="115" class="text-red">Spart Pop+Push</text>
</svg>
