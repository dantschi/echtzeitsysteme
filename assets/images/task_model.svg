<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="250" font-family="Inter, sans-serif">
  <style>
    .bg { fill: #F5F5F7; }
    .box-main { fill: #FFFFFF; stroke: #1D1D1F; stroke-width: 2; }
    .box-exec { fill: rgba(226, 0, 26, 0.1); stroke: #E2001A; stroke-width: 2; }
    .text-dark { fill: #1D1D1F; font-size: 16px; font-weight: 500; text-anchor: middle; }
    .text-small { fill: #86868B; font-size: 14px; text-anchor: middle; }
    .text-red { fill: #E2001A; font-size: 16px; font-weight: bold; text-anchor: middle; }
    .line-axis { stroke: #1D1D1F; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .line-dash { stroke: #86868B; stroke-width: 1.5; stroke-dasharray: 4,4; }
    .arrow-red { stroke: #E2001A; stroke-width: 2; fill: none; marker-end: url(#arrow-red); }
    .arrow-dark { stroke: #1D1D1F; stroke-width: 2; fill: none; marker-end: url(#arrow-dark); }
    .arrow-both-red { stroke: #E2001A; stroke-width: 2; fill: none; marker-start: url(#arrow-red-start); marker-end: url(#arrow-red); }
    .arrow-both-dark { stroke: #1D1D1F; stroke-width: 2; fill: none; marker-start: url(#arrow-start); marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D1D1F" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#1D1D1F" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E2001A" />
    </marker>
    <marker id="arrow-red-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#E2001A" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D1D1F" />
    </marker>
  </defs>

  <!-- Axis -->
  <line x1="50" y1="180" x2="850" y2="180" class="line-axis" />
  <text x="850" y="200" class="text-small">Zeit t</text>

  <!-- Job Arrival 1 -->
  <path d="M 150 120 L 150 175" class="arrow-dark" />
  <text x="150" y="110" class="text-dark">Ankunft (Release)</text>
  <line x1="150" y1="180" x2="150" y2="230" class="line-dash" />

  <!-- Execution Block (WCET) -->
  <rect x="200" y="140" width="120" height="40" class="box-exec" />
  <text x="260" y="165" class="text-red">C (WCET)</text>

  <!-- Response Time R -->
  <line x1="150" y1="215" x2="320" y2="215" class="arrow-both-dark" />
  <text x="235" y="235" class="text-small">Response Time R</text>
  
  <line x1="320" y1="180" x2="320" y2="220" class="line-dash" />

  <!-- Deadline D -->
  <path d="M 450 120 L 450 175" class="arrow-red" />
  <text x="450" y="110" class="text-red">Deadline D</text>
  <line x1="450" y1="180" x2="450" y2="70" class="line-dash" />

  <!-- Relative Deadline D bracket -->
  <line x1="150" y1="80" x2="450" y2="80" class="arrow-both-red" />
  <text x="300" y="70" class="text-red">Relative Deadline D</text>

  <!-- Next Arrival / Period T -->
  <path d="M 650 120 L 650 175" class="arrow-dark" />
  <text x="650" y="110" class="text-dark">Nächster Release</text>
  <line x1="650" y1="180" x2="650" y2="40" class="line-dash" />
  <line x1="150" y1="180" x2="150" y2="40" class="line-dash" />

  <line x1="150" y1="50" x2="650" y2="50" class="arrow-both-dark" />
  <text x="400" y="40" class="text-dark">Periode T</text>

</svg>